<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reel Script Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0D12;--bg:#0B0D12;--s1:#12151D;--s2:#181C26;--line:#262B38;--text:#ECEEF3;--muted:#9AA3B5;
--amber:#FFB547;--amber-soft:rgba(255,181,71,.12);--teal:#3DD6C6;--teal-soft:rgba(61,214,198,.12);
--ok:#4ADE80;--warn:#FBBF24;--bad:#F87171;--r:16px;--gap:8px;--font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;--pixel:"Silkscreen","Courier New",monospace;color-scheme:dark}
:root[data-theme=light]{--bg:#F6F5F2;--s1:#FFFFFF;--s2:#F0EEE9;--line:#E2DFD8;--text:#14161C;--muted:#5D6472;--amber:#C27803;--amber-soft:#FDF1DC;--teal:#0E8F83;--teal-soft:#DDF4F1;color-scheme:light}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#F6F5F2;--s1:#FFFFFF;--s2:#F0EEE9;--line:#E2DFD8;--text:#14161C;--muted:#5D6472;--amber:#C27803;--amber-soft:#FDF1DC;--teal:#0E8F83;--teal-soft:#DDF4F1;color-scheme:light}}
:root{--hi:rgba(255,255,255,.04);--shadow:0 1px 0 var(--hi) inset,0 12px 32px -18px rgba(0,0,0,.6);--nav-h:64px;
--b-hook:#FFB547;--b-retention:#FF8A5B;--b-problem:#F472B6;--b-solution:#3DD6C6;--b-proof:#7AA2FF;--b-cta:#4ADE80}
:root[data-theme=light]{--ok:#15803D;--warn:#B45309;--bad:#DC2626;--hi:rgba(255,255,255,.9);--shadow:0 1px 2px rgba(20,22,28,.06),0 10px 28px -20px rgba(20,22,28,.35)}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--ok:#15803D;--warn:#B45309;--bad:#DC2626;--hi:rgba(255,255,255,.9);--shadow:0 1px 2px rgba(20,22,28,.06),0 10px 28px -20px rgba(20,22,28,.35)}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15.5px;line-height:1.7;
background-image:radial-gradient(900px 480px at 85% -8%,var(--amber-soft),transparent 62%),radial-gradient(700px 520px at 0% 108%,var(--teal-soft),transparent 60%);background-attachment:fixed}
[dir=ltr] body{background-image:radial-gradient(900px 480px at 15% -8%,var(--amber-soft),transparent 62%),radial-gradient(700px 520px at 100% 108%,var(--teal-soft),transparent 60%)}
bdi,[dir=auto]{unicode-bidi:isolate}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.kick{font-family:var(--pixel);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);line-height:1.4;display:block}
/* shell */
.app{display:block;min-height:100vh}
.rail{position:fixed;inset-inline:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--s1) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.brand{display:none}
nav.tabs{display:flex;overflow-x:auto;scrollbar-width:none;height:var(--nav-h)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;color:var(--muted);font-size:11px;line-height:1.2;cursor:pointer;padding:6px 4px;position:relative;transition:color .2s ease-out}
nav.tabs button svg.i{width:20px;height:20px}
nav.tabs button[aria-selected=true]{color:var(--amber)}
nav.tabs button[aria-selected=true]::after{content:"";position:absolute;top:0;inset-inline:22%;height:2px;border-radius:2px;background:var(--amber);box-shadow:0 0 12px var(--amber)}
.rail-foot{display:none}
.main{max-width:1008px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}
@media (min-width:900px){
.app{display:grid;grid-template-columns:232px minmax(0,1fr)}
.rail{position:sticky;top:0;bottom:auto;height:100vh;border-top:0;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px;background:color-mix(in srgb,var(--s1) 70%,transparent)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.brand .mk{width:34px;height:34px;border-radius:10px;background:var(--ink);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 0 0 3px var(--amber-soft)}
.brand .mk i{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber)}
.brand b{font-size:14px;line-height:1.2;display:block}
nav.tabs{flex-direction:column;height:auto;gap:2px;overflow:visible}
nav.tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;padding:10px 12px;border-radius:12px;text-align:start}
nav.tabs button:hover{background:var(--s2);color:var(--text)}
nav.tabs button[aria-selected=true]{background:var(--amber-soft);color:var(--text)}
nav.tabs button[aria-selected=true] svg.i{color:var(--amber)}
nav.tabs button[aria-selected=true]::after{top:22%;bottom:22%;inset-inline:auto;inset-inline-start:-14px;width:3px;height:auto}
.rail-foot{display:block;margin-top:auto;padding:12px 8px 0;font-size:12px;color:var(--muted);line-height:1.5}
.main{padding:28px 40px 64px}
}
header.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-start;justify-content:space-between;margin-bottom:22px}
header.top h1{margin:4px 0 2px;font-size:clamp(1.35rem,3.6vw,1.9rem);line-height:1.25;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
header.top .aud{color:var(--muted);font-size:.9rem;margin:0}
.ht{min-width:0;flex:1 1 300px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:2px 10px;font-size:.78rem;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.a{color:var(--amber);background:var(--amber-soft);border-color:transparent}
.chip.t{color:var(--teal);background:var(--teal-soft);border-color:transparent}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--s1);display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:color .2s,border-color .2s}
.iconbtn:hover{color:var(--amber);border-color:var(--amber)}
/* panels */
.panel{display:none}.panel.active{display:block;animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ph{margin:0 0 16px}.ph h2{margin:2px 0 0;font-size:1.3rem;line-height:1.35}.ph p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
h3{font-size:1rem;margin:0 0 8px;line-height:1.4}
p{margin:4px 0}
.muted{color:var(--muted)}.small{font-size:.85rem}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card+.card,.card+.grid,.grid+.card,.grid+.grid,.sec{margin-top:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{justify-content:space-between}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--s2);color:var(--text);border-radius:11px;padding:7px 13px;font-size:.88rem;cursor:pointer;line-height:1.3;transition:border-color .15s ease-out,background .15s ease-out,transform .15s ease-out}
.btn:hover{border-color:var(--amber)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:var(--ink);font-weight:700}
.btn.pri:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg.i{width:16px;height:16px}
.note{border:1px solid transparent;border-inline-start:3px solid var(--amber);background:var(--amber-soft);padding:10px 14px;border-radius:12px;margin:10px 0;font-size:.92rem}
.note.t{border-inline-start-color:var(--teal);background:var(--teal-soft)}
.note.b{border-inline-start-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
ul.cl,ol.cl{margin:4px 0;padding-inline-start:20px}ul.cl li,ol.cl li{margin:3px 0}
pre.cp{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:.95rem}
.sev{font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 9px;white-space:nowrap;display:inline-block;border:1px solid currentColor}
.sev.critical,.sev.reject{color:var(--bad)}.sev.high,.sev.revise{color:var(--warn)}.sev.medium{color:var(--teal)}.sev.low{color:var(--muted)}.sev.approve{color:var(--ok)}
.tag-chip{display:inline-block;unicode-bidi:isolate;border-radius:6px;padding:0 6px;margin:0 2px;font-size:.82em;font-weight:600;color:var(--k);background:color-mix(in srgb,var(--k) 14%,transparent);border:1px solid color-mix(in srgb,var(--k) 40%,transparent)}
.tag-chip[data-kind=accent]{--k:var(--teal)}.tag-chip[data-kind=pause]{--k:var(--muted)}.tag-chip[data-kind=emotion]{--k:var(--amber)}.tag-chip[data-kind=break]{--k:#A78BFA}
:root[data-theme=light] .tag-chip[data-kind=break]{--k:#6D28D9}
.slot{display:inline;unicode-bidi:isolate;border:1px dashed var(--amber);border-radius:6px;padding:0 5px;background:var(--amber-soft);color:var(--amber);font-weight:600;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#prompter .slot{border:2px dashed #FFB547;background:rgba(255,181,71,.16);color:#FFB547;border-radius:10px;padding:0 10px}
#totals .slot-warn{color:var(--amber);border-color:var(--amber);font-weight:700}
#totals .blocked-chip{color:var(--bad);border-color:var(--bad);font-weight:700;white-space:normal}
.el-txt{line-height:2;font-size:1rem;margin:8px 0}.el-big{font-size:1.05rem;padding:12px 22px}
.segc{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:12px;background:var(--s2);border:1px solid var(--line)}
.segc button{border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:9px;font-size:.85rem;cursor:pointer;transition:background .15s,color .15s}
.segc button[aria-pressed=true]{background:var(--s1);color:var(--text);box-shadow:0 1px 0 var(--hi) inset,0 2px 8px rgba(0,0,0,.25)}
/* studio */
.console{display:grid;gap:14px}
#timeline{display:flex;gap:2px;height:44px;border-radius:12px;overflow:hidden;background:var(--s2);border:1px solid var(--line);padding:3px}
#timeline.over{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 18%,transparent)}
#timeline .seg{flex-basis:0;min-width:0;border-radius:8px;background:var(--bc);color:var(--ink);font-size:11px;font-weight:700;line-height:1.15;padding:5px 7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transition:flex-grow .25s ease-out;cursor:pointer;border:0;text-align:start}
#timeline .seg small{display:block;font-weight:500;opacity:.75}
#timeline .rest{flex-basis:0;border-radius:8px;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px)}
.tl-cap{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:6px}
.beat{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.beat::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;background:var(--bc)}
.bh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:12px}
.bh .n{font-family:var(--pixel);font-size:11px;color:var(--bc)}
.bh h3{margin:0;font-size:1.05rem}
.bh .st{margin-inline-start:auto;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.opt{position:relative;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:var(--s2);transition:border-color .15s ease-out,background .15s ease-out}
.opt:hover{border-color:color-mix(in srgb,var(--amber) 55%,var(--line))}
.opt:has(input:checked){border-color:var(--amber);background:var(--amber-soft);box-shadow:0 0 0 1px var(--amber) inset}
.opt:has(input:focus-visible){outline:2px solid var(--amber);outline-offset:2px}
.opt .top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.74rem;color:var(--muted)}
.opt .top .wc{margin-inline-start:auto;font-variant-numeric:tabular-nums}
.opt .tx{font-size:1.02rem;font-weight:500;line-height:1.65;overflow-wrap:anywhere}
.opt .mm{font-size:.78rem;color:var(--muted)}
.opt .vis{font-size:.8rem;color:var(--text);background:var(--s1);border:1px dashed var(--line);border-radius:10px;padding:6px 8px}
.pill{display:inline-block;font-size:.74rem;border-radius:7px;padding:1px 8px;background:var(--ink);color:#fff;margin:2px}
:root[data-theme=light] .pill{background:#14161C}
.tag{font-size:.7rem;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap;border:1px solid currentColor}
.tag.recommended{color:var(--ok)}.tag.safe_edit{color:var(--teal)}.tag.bold{color:var(--amber)}.tag.new,.tag.ht{color:var(--muted)}
.edt{margin-top:10px}
.edt>button{background:none;border:0;color:var(--muted);font-size:.82rem;display:inline-flex;gap:6px;align-items:center;cursor:pointer;padding:4px 0}
.edt>button:hover{color:var(--amber)}
.edt textarea{display:block;width:100%;min-height:72px;font:inherit;font-size:1rem;line-height:1.8;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--s2);color:var(--text);resize:vertical;margin-top:6px}

#totals{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);z-index:20;margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;justify-content:space-between;padding:10px 12px;border-radius:18px;border:1px solid var(--line);background:color-mix(in srgb,var(--s1) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 18px 40px -20px rgba(0,0,0,.7)}
@media (min-width:900px){#totals{bottom:16px}}
.tot{display:flex;align-items:center;gap:10px;min-width:0}
.ring{width:42px;height:42px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--amber);stroke-linecap:round;transition:stroke-dasharray .25s ease-out,stroke .2s}
#totals.over .ring .fg{stroke:var(--bad)}
.tot b{font-size:1.15rem;font-variant-numeric:tabular-nums;display:block;line-height:1.2}
.tot span{font-size:.76rem;color:var(--muted)}
.tot .ov{color:var(--bad);font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts .btn{padding:8px 11px}
@media (max-width:640px){#totals{padding:8px 10px;gap:8px}.ring{width:34px;height:34px}.acts .btn .l{display:none}.acts{width:100%;justify-content:space-between}.acts .btn{flex:1;justify-content:center}}
/* prompter */
#prompter{position:fixed;inset:0;z-index:80;background:#07080B;color:#F4F5F8;display:none;flex-direction:column}
#prompter.open{display:flex}
#prompter .bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px calc(10px) ;padding-top:calc(10px + env(safe-area-inset-top,0px));background:#0E1016;border-bottom:1px solid #1E2230;font-size:.85rem}
#prompter .bar .btn{background:#181C26;border-color:#262B38;color:#ECEEF3}
#prompter .bar .btn.pri{background:#FFB547;color:#0B0D12;border-color:#FFB547}
#prompter label{display:flex;gap:6px;align-items:center;color:#9AA3B5}
#prompter input[type=range]{width:90px;accent-color:#FFB547}
#prompter .scr{flex:1;overflow:hidden;position:relative}
#prompter .scr::before{content:"";position:fixed;inset-inline:0;top:42%;height:2px;background:rgba(255,181,71,.55);box-shadow:0 0 18px rgba(255,181,71,.5);pointer-events:none;z-index:1}
#prompter .inner{padding:38vh 6vw 70vh;font-size:40px;line-height:1.65;font-weight:600;text-align:center;max-width:1100px;margin:0 auto}
#prompter .pz{color:#FFB547}
#prompter .msg{color:#3DD6C6;font-size:.85rem;padding:6px 14px;background:#0E1016;min-height:1.5em;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
/* overview */
.hero{position:relative;overflow:hidden;padding:22px}
.hero::after{content:"";position:absolute;inset-inline-end:-80px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(closest-side,var(--amber-soft),transparent);pointer-events:none}
.rec{display:inline-flex;align-items:center;gap:7px;font-family:var(--pixel);font-size:10px;letter-spacing:.14em;color:var(--bad)}
.rec.blocked::before{animation:none;border-radius:2px}
.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 10px var(--bad);animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.big{font-size:2.1rem;font-weight:700;line-height:1.15;letter-spacing:-.02em}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.stats3>div{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stats3 .muted{font-size:.75rem}.stats3 b{display:block;font-size:1.05rem;overflow-wrap:anywhere}
@media (max-width:480px){.stats3{grid-template-columns:1fr 1fr}}
.take{background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);border-radius:14px;padding:12px 14px;font-size:1.05rem;font-weight:500;margin:10px 0}
ol.fx{list-style:none;padding:0;margin:8px 0 0;counter-reset:f}
ol.fx li{counter-increment:f;display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
ol.fx li::before{content:counter(f);font-family:var(--pixel);font-size:11px;color:var(--ink);background:var(--amber);border-radius:6px;min-width:22px;height:22px;display:grid;place-items:center;margin-top:2px}
/* idea */
.bar5{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:4px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.bar5:first-of-type{border-top:0}
.bar5 .tr{height:8px;border-radius:99px;background:var(--s2);overflow:hidden}
.bar5 .tr i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--amber))}
[dir=rtl] .bar5 .tr i{background:linear-gradient(270deg,var(--teal),var(--amber))}
.bar5 .rs{grid-column:1/-1;font-size:.8rem;color:var(--muted)}
.bar5 b{font-variant-numeric:tabular-nums;font-size:.9rem}
.vs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.vs .gen{background:var(--s2);border-style:dashed}
.vs .gen p{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.vs .ours{border-color:color-mix(in srgb,var(--teal) 50%,var(--line))}
a{color:var(--teal)}
/* audit */
.atl{position:relative;height:56px;margin:8px 10px 0}
.atl .trk{position:absolute;inset-inline:0;top:26px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--line),var(--s2))}
.marker{position:absolute;top:16px;width:24px;height:24px;margin-inline-start:-12px;border-radius:50%;border:3px solid var(--s1);background:var(--mc);cursor:pointer;padding:0;box-shadow:0 0 0 1px var(--mc),0 0 14px color-mix(in srgb,var(--mc) 60%,transparent);transition:transform .15s ease-out}
.marker:hover,.marker[aria-pressed=true]{transform:scale(1.25)}
.marker.critical{--mc:var(--bad)}.marker.high{--mc:var(--warn)}.marker.medium{--mc:var(--teal)}.marker.low{--mc:var(--muted)}
@media (max-width:640px){.marker{width:18px;height:18px;margin-inline-start:-9px;top:19px;border-width:2px}}

function srt(){
  const pad=(n,z)=>String(n).padStart(z,'0');
  const ts=s=>{ const ms=Math.round(s*1000); return `${pad(Math.floor(ms/3600000),2)}:${pad(Math.floor(ms/60000)%60,2)}:${pad(Math.floor(ms/1000)%60,2)},${pad(ms%1000,3)}`; };
  let t=0, i=1; const out=[];
  currentLines().forEach(l=>{
    const total=secsFor(l.text,l.beat); const parts=[]; l.text.split(PAUSE_RE).map(x=>x.trim()).filter(x=>x && x!=='/').forEach(x=>{ if(parts.length && (x.split(/\s+/).length<3 || parts[parts.length-1].split(/\s+/).length<3) && (parts[parts.length-1]+' '+x).split(/\s+/).length<=9) parts[parts.length-1]+=' '+x; else parts.push(x); });

    chunks.forEach(c=>{ const d=total*Math.max(1,countWords(c))/wsum; out.push(`${i++}\n${ts(t)} --> ${ts(t+d)}\n${c}\n`); t+=d; });

const SEV_RANK={critical:0,high:1,medium:2,low:3};
const bySeverity=list=>(list||[]).map((f,i)=>({f,i})).sort((a,b)=>((SEV_RANK[a.f.severity]??4)-(SEV_RANK[b.f.severity]??4))||a.i-b.i).map(x=>x.f);
/* Original draft as lines (newlines, then sentence ends); each audit finding underlined where its line is found. */
function draftLines(text, findings){
  const marks=[];
  bySeverity(findings).forEach(f=>{
    const raw=String(f.line||'').trim(); if(!raw) return;
    let q=raw, i=text.indexOf(q);
    if (i<0){ q=raw.replace(/[\s.,،!?؟…]+$/,''); i=q?text.indexOf(q):-1; }
    if (i<0) return;
    const e=i+q.length;
    if (!marks.some(m=>i<m.e && e>m.s)) marks.push({s:i,e,f});
  });
  const lines=[]; let st=0, m;
  const re=/\n+|(?<=[.!?؟…])[ \t]+/g;
  while((m=re.exec(text))){ lines.push([st,m.index]); st=m.index+m[0].length; }
  lines.push([st,text.length]);
  return lines.filter(([a,b])=>text.slice(a,b).trim()).map(([a,b])=>{
    const ln=h('div',{class:'ln',dir:'auto'}); let pos=a;
    marks.filter(k=>k.s<b && k.e>a).sort((x,y)=>x.s-y.s).forEach(k=>{
      const s=Math.max(k.s,a), e=Math.min(k.e,b);
      if (s>pos) ln.append(text.slice(pos,s));
      ln.appendChild(h('span',{class:'ba-hit '+k.f.severity,title:String(k.f.issue||'')},text.slice(s,e)));
      pos=e;
      if (k.e<=b){ const p=/^[.,،!?؟…]+/.exec(text.slice(pos,b)); if(p){ ln.append(p[0]); pos+=p[0].length; } ln.appendChild(sev(k.f.severity+' ba-chip',L(S.sevw,k.f.severity))); }
    });
    if (pos<b) ln.append(text.slice(pos,b));
    return ln;
  });
}

/* ---------- v2.2: evidence, concept, research, Viewer Mind ---------- */
const VPAL={target:{B:'#FFB547',C:'#E08A00',P:'#FFE3B0'},stranger:{B:'#7AA2FF',C:'#4C6FD6',P:'#DDE6FF'},skeptic:{B:'#9AA3B5',C:'#6B7385',P:'#2B2F3A'}};
const PERSONAS=['target','stranger','skeptic'];
function basisChip(b){
  if (!b || !b.type) return null;
  const lab=L(S.basisT,b.type)+': ', ref=String(b.ref==null?'':b.ref);
  if (b.type==='research'){
    const s=((D.research||{}).sources||[]).find(x=>x.id===ref); if (!s) return h('span',{class:'basis chip'},lab,T(ref));
    const u=safeUrl(s.url);
    return h('span',{class:'basis chip t'},lab,u?h('a',{href:u,target:'_blank',rel:'noopener noreferrer'},T(s.title)):T(s.title));
  }
  if (b.type==='craft_rule'){ const r=(PAYLOAD.craft_rules||{})[ref]; return h('span',{class:'basis chip'},lab,T(r?(AR?r.ar:r.en):ref)); }
  if (b.type==='creator_data'){ const i=ref.indexOf(':'), sc=ref.slice(0,i), nm=ref.slice(i+1); return h('span',{class:'basis chip a'},lab,T(sc==='performance'?L(S.dna.m,nm):nm)); }
  return h('span',{class:'basis chip a'},lab,T('«'+ref+'»'));
}
function conceptCard(){
  const c=D.concept; if (!c) return null;
  return h('div',{class:'card sec',id:'concept'},head('Concept',S.concept.title),h('p',{class:'logline',dir:DIR},T(c.logline)),
    h('div',{class:'grid g2'},h('div',null,h('span',{class:'kick'},S.concept.promise),h('p',{dir:DIR},T(c.promise))),
      h('div',null,h('span',{class:'kick'},S.concept.payoff+' · '+beatLabel(c.payoff_beat)),h('p',{dir:DIR},T('«'+c.payoff_line+'»')))),
    h('p',{class:'small',dir:DIR},h('b',null,S.concept.turn+': '),T(c.turn)),
    h('h3',{style:'margin-top:10px'},S.concept.journey),h('ol',{class:'journey'},(c.journey||[]).map(j=>h('li',{dir:DIR},T(j)))),
    (c.details||[]).length?[h('h3',{style:'margin-top:12px'},S.concept.details),table([S.concept.detail,S.concept.where,S.why],c.details.map(d=>[d.detail,L(S.concept.place,d.placement),d.reason||'']))]:null);
}
function researchCard(){
  const R2=D.research; if (!R2) return null;
  const box=h('div',{class:'card',id:'research'},head('Research',S.res.title),h('span',{class:'chip '+(R2.status==='completed'?'t':'a')},L(S.res.status,R2.status)));
  if (D.idea.avoided_angle) box.append(h('div',{class:'note t'},h('b',null,S.res.avoided+': '),T(D.idea.avoided_angle.angle)));
  if ((R2.questions||[]).length) box.append(h('h3',{style:'margin-top:12px'},S.res.questions),h('ul',{class:'cl'},R2.questions.map(q=>h('li',{dir:DIR},T(q)))));
  box.append(h('ul',{class:'src',id:'sources'},(R2.sources||[]).map(s=>{ const u=safeUrl(s.url);
    return h('li',null,h('span',{class:'chip'},L(S.res.kind,s.kind)),' ',u?h('a',{href:u,target:'_blank',rel:'noopener noreferrer'},T(s.title)):T(s.title),
      h('span',{class:'small muted'},' · '+(s.accessed||'')+(s.retrieval==='opened'?'':' · '+S.res.snippet)),
      h('p',{class:'small',dir:'auto'},T(s.observation)),
      (s.used_for||[]).length?h('p',{class:'small muted',dir:'auto'},S.res.used+': ',T(s.used_for.join(' · '))):null); })));
  if ((R2.limitations||'').trim()) box.append(h('p',{class:'small muted',dir:'auto'},T(R2.limitations)));
  box.append(h('p',{class:'small muted'},S.res.limit));
  return box;
}
function renderViewer(p){
  const VM=D.viewer_mind;
  if (!VM){ p.appendChild(card('',h('p',{class:'muted'},S.vm.none))); return; }
  p.appendChild(h('div',{class:'note t vm-label'},h('b',null,S.vm.label),' ',S.vm.help));
  const per={}; (VM.personas||[]).forEach(x=>per[x.id]=x);
  p.appendChild(h('div',{class:'vm-personas'},PERSONAS.filter(k=>per[k]).map(k=>{ const x=per[k];
    return h('div',{class:'card vm-persona','data-p':k},h('div',{class:'vm-ph'},sprite(k),h('div',null,h('span',{class:'kick'},L(S.vm.who,k)),h('p',{class:'vm-who',dir:DIR},T(x.who)))),
      h('p',{class:'small muted',dir:DIR},T(x.context)),h('p',{class:'small',dir:DIR},h('b',null,S.vm.want+': '),T(x.want)),
      x.swipe_trigger?h('p',{class:'small',dir:DIR},h('b',null,S.vm.trigger+': '),T(x.swipe_trigger)):null); })));
  const holds=c=>(c.runs||[]).filter(r=>r.verdict==='stays').length;
  const sw=h('div',{class:'segc',id:'vm-switch',role:'group','aria-label':S.vm.lab}), strip=h('div',{id:'vm-strip','aria-live':'polite'});
  function draw(ref){
    const c=VM.candidates.find(x=>x.ref===ref); if (!c) return;

    strip.append(h('div',{class:'vm-hook'},h('span',{class:'kick'},ref==='original'?S.vm.before:ref+(ref===VM.chosen?' · '+S.vm.chosenTag:'')),
      h('p',{class:'vm-line',dir:DIR},T(stripMarkup(c.text).replace(/\s+/g,' ').trim())),c.visual?h('span',{class:'vis'},'🎬 ',T(c.visual)):null,(c.onscreen||[]).map(x=>h('span',{class:'pill'},T(x))),' ',
      h('span',{class:'chip '+(holds(c)>=2?'t':'a')},S.vm.holds(holds(c)))));
    PERSONAS.forEach(k=>{ const r=(c.runs||[]).find(x=>x.persona===k); if (!r) return;
      strip.appendChild(h('div',{class:'vm-run','data-p':k},
        h('div',{class:'vm-rh'},h('b',null,L(S.vm.who,k)),h('span',{class:'sev '+(r.verdict==='stays'?'approve':'reject')},r.verdict==='stays'?S.vm.stays:S.vm.swipes(r.decided_at))),
        h('div',{class:'vm-cells'},(r.moments||[]).map(m=>h('div',{class:'vm-cell','data-state':m.state},
          h('span',{class:'vm-s'},m.second+S.sec+' · '+L(S.vm.state,m.state)),h('q',{dir:DIR},T(m.thinks)),
          h('span',{class:'small muted',dir:DIR},'👁 ',T(m.sees)),h('span',{class:'small',dir:DIR},'🔊 ',m.heard_so_far?T(m.heard_so_far):S.vm.nothing)))),
        h('p',{class:'small',dir:DIR,style:'margin-top:6px'},T(r.reason)),basisChip(r.basis))); });
  }
  VM.candidates.forEach(c=>sw.appendChild(h('button',{type:'button','data-ref':c.ref,onclick:()=>draw(c.ref)},(c.ref==='original'?S.vm.before:c.ref)+(c.ref===VM.chosen?' ✓':'')+' · '+holds(c)+'/3')));
  p.appendChild(card('',h('div',{class:'row sp',style:'margin-bottom:8px'},h('div',null,head('Hook lab',S.vm.lab)),sw),strip));
  if ((VM.unresolved||'').trim()) p.appendChild(h('div',{class:'note'},h('b',null,S.vm.unresolved+': '),T(VM.unresolved)));
  else if (VM.chosen==='original') p.appendChild(h('div',{class:'note t'},S.vm.origWon));
  draw(VM.chosen);
}
